CTE:
    plenta_gallery:
        - Foto-Album
        - Teaser mit Titelbild und Alias-Link, der ein Bildraster eines Verzeichnisses öffnet.
tl_content:
    galleryTitle:
        - Titel
        - Der Titel der Galerie. Daraus wird der Alias erzeugt.
    galleryAlias:
        - Alias
        - Der Alias wird an die URL der Seite angehängt. Leer lassen, um ihn aus dem Titel zu erzeugen.
    galleryText:
        - Text
        - Der Text, der im Teaser und über den Bildern angezeigt wird.
    galleryLinkText:
        - Link-Text
        - Der Text des Links im Teaser. Leer lassen, um den Standardtext zu verwenden.
    galleryDate:
        - Datum
        - Das Datum des Albums, zum Beispiel das Datum der Veranstaltung. Es wird im Teaser und in der Galerie angezeigt.
    gallerySortBy:
        - Sortierung der Bilder
        - Legt fest, in welcher Reihenfolge die Bilder des Verzeichnisses angezeigt werden.
    galleryFolder:
        - Verzeichnis
        - Bitte wählen Sie das Verzeichnis mit den Galerie-Bildern.
    galleryCover:
        - Titelbild
        - Das Bild, das im Teaser angezeigt wird.
    galleryCoverSize:
        - Titelbild-Größe
        - Die Größe des Titelbilds im Teaser. Die Bildgröße darüber gilt für die Galerie-Bilder.
    gallery_legend: Galerie-Einstellungen
