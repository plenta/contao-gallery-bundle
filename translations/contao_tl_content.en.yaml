CTE:
    plenta_gallery:
        - Photo album
        - Teaser with cover image and an alias link that opens an image grid of a folder.
tl_content:
    galleryTitle:
        - Title
        - The title of the gallery. The alias is generated from it.
    galleryAlias:
        - Alias
        - The alias is appended to the page URL. Leave empty to generate it from the title.
    galleryText:
        - Text
        - The text shown in the teaser and above the images.
    galleryLinkText:
        - Link text
        - The text of the teaser link. Leave empty to use the default text.
    galleryDate:
        - Date
        - The date of the album, for example the date of the event. It is shown in the teaser and in the gallery.
    gallerySortBy:
        - Image sorting
        - Defines the order in which the images of the folder are displayed.
    galleryFolder:
        - Folder
        - Please choose the folder containing the gallery images.
    galleryCover:
        - Cover image
        - The image shown in the teaser.
    galleryCoverSize:
        - Cover image size
        - The size of the cover image in the teaser. The image size above applies to the gallery images.
    gallery_legend: Gallery settings
